<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150">
  <defs>
    <path id="spark" d="M0-6Q0 0 6 0Q0 0 0 6Q0 0-6 0Q0 0 0-6Z"/>
    <path id="catBody" d="M-18 0C-22-20-16-36-9-40C-14-44-15-52-13-58L-14-70L-6-62C-2-63 2-63 6-62L14-70L13-58C15-52 14-44 9-40C16-36 22-20 18 0Z"/>
    <path id="catTail" d="M15-4C32-4 36-20 28-30"/>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD6E8" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFD6E8"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect x="1" y="1" width="838" height="148" rx="18" fill="#0a0a0a" stroke="#222222"/>

  <!-- twinkling stars -->
  <g>
    <use href="#spark" transform="translate(40 30) scale(.8)" fill="#FFD6E8"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(160 40) scale(.6)" fill="#B08D57"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(240 22) scale(1)" fill="#ffffff"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" begin=".4s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(300 115) scale(.6)" fill="#FFD6E8"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(330 36) scale(.7)" fill="#B08D57"><animate attributeName="opacity" values=".2;1;.2" dur="1.9s" begin=".8s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(515 28) scale(.9)" fill="#FFD6E8"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" begin=".2s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(560 118) scale(.6)" fill="#ffffff"><animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(605 45) scale(.6)" fill="#B08D57"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" begin="1s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(800 110) scale(.8)" fill="#FFD6E8"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" begin=".6s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(805 30) scale(.6)" fill="#ffffff"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></use>

    <circle cx="70" cy="70" r="1.4" fill="#E8E8E8"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="80" r="1.2" fill="#FFD6E8"><animate attributeName="opacity" values="1;.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="60" r="1.3" fill="#B08D57"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="20" r="1.3" fill="#E8E8E8"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="128" r="1.2" fill="#FFD6E8"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="20" r="1.4" fill="#E8E8E8"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="95" r="1.2" fill="#B08D57"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.08;.18;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="360 10;470 50;470 50" keyTimes="0;.18;1" dur="7s" repeatCount="indefinite"/>
    <g transform="rotate(20)">
      <rect x="-46" y="-1" width="46" height="2" rx="1" fill="url(#trail)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- crescent moon -->
  <circle cx="680" cy="44" r="22" fill="#B08D57"/>
  <circle cx="690" cy="37" r="20" fill="#0a0a0a"/>

  <!-- text -->
  <text x="420" y="78" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#FFD6E8">~ meow-chine learning mode ~</text>
  <text x="420" y="100" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#B8B8B8">training models after midnight, one purr at a time</text>

  <!-- cat 1 (big, left) -->
  <g transform="translate(95 132)">
    <g>
      <use href="#catTail" fill="none" stroke="#B08D57" stroke-width="7" stroke-linecap="round"/>
      <use href="#catTail" fill="none" stroke="#050505" stroke-width="4.6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="0 15 -4;14 15 -4;0 15 -4" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <use href="#catBody" fill="#050505" stroke="#B08D57" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse cx="-5" cy="-52" rx="2.2" ry="2.6" fill="#FFD6E8"><animate attributeName="ry" values="2.6;2.6;.3;2.6" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="5" cy="-52" rx="2.2" ry="2.6" fill="#FFD6E8"><animate attributeName="ry" values="2.6;2.6;.3;2.6" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
    <path d="M-1.4-47H1.4L0-45.4Z" fill="#B08D57"/>
  </g>

  <!-- cat 2 (small kitten) -->
  <g transform="translate(160 132) scale(.62)">
    <g>
      <use href="#catTail" fill="none" stroke="#B08D57" stroke-width="7" stroke-linecap="round"/>
      <use href="#catTail" fill="none" stroke="#050505" stroke-width="4.6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="0 15 -4;-10 15 -4;0 15 -4" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <use href="#catBody" fill="#050505" stroke="#B08D57" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="-5" cy="-52" rx="2.4" ry="2.8" fill="#B08D57"><animate attributeName="ry" values="2.8;2.8;.3;2.8" keyTimes="0;.85;.9;1" dur="3.2s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="5" cy="-52" rx="2.4" ry="2.8" fill="#B08D57"><animate attributeName="ry" values="2.8;2.8;.3;2.8" keyTimes="0;.85;.9;1" dur="3.2s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- cat 3 (right, gazing at the moon) -->
  <g transform="translate(745 132) scale(.85)">
    <g>
      <use href="#catTail" fill="none" stroke="#B08D57" stroke-width="7" stroke-linecap="round"/>
      <use href="#catTail" fill="none" stroke="#050505" stroke-width="4.6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="0 15 -4;10 15 -4;0 15 -4" dur="3s" repeatCount="indefinite"/>
    </g>
    <use href="#catBody" fill="#050505" stroke="#B08D57" stroke-width="1.6" stroke-linejoin="round"/>
    <ellipse cx="-4" cy="-54" rx="2.2" ry="2.6" fill="#FFD6E8"><animate attributeName="ry" values="2.6;2.6;.3;2.6" keyTimes="0;.92;.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="6" cy="-54" rx="2.2" ry="2.6" fill="#FFD6E8"><animate attributeName="ry" values="2.6;2.6;.3;2.6" keyTimes="0;.92;.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <path d="M-.4-49H2.4L1-47.4Z" fill="#B08D57"/>
  </g>
</svg>
