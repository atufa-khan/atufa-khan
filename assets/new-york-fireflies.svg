  <title id="title">New York skyline with fireflies</title>
  <desc id="desc">A New York inspired night skyline with a bridge, white windows, cool blue lights, and glowing fireflies above the rooftops.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050716"/>
      <stop offset="48%" stop-color="#071427"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#8f6f21"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fff0a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
