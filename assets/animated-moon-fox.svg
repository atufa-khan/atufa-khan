<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Animated moon fox</title>
  <desc id="desc">A dark anime-style fox with a softly moving tail under a small moon and stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="52%" stop-color="#08112a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5c7" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="760" height="220" rx="18" fill="url(#sky)"/>
  <g opacity=".72">
    <circle cx="76" cy="47" r="1.5" fill="#dbeafe"/>
    <circle cx="144" cy="84" r="1.1" fill="#dbeafe"/>
    <circle cx="232" cy="38" r="1.3" fill="#dbeafe"/>
    <circle cx="504" cy="49" r="1.2" fill="#dbeafe"/>
    <circle cx="611" cy="84" r="1.4" fill="#dbeafe"/>
    <circle cx="694" cy="43" r="1.1" fill="#dbeafe"/>
  </g>

  <circle cx="585" cy="58" r="35" fill="url(#moonGlow)"/>
  <circle cx="585" cy="58" r="17" fill="#f8efd0"/>
  <circle cx="592" cy="51" r="5" fill="#b8c7dd" opacity=".35"/>
  <circle cx="578" cy="64" r="3" fill="#b8c7dd" opacity=".28"/>

  <g transform="translate(218 112)">
    <g transform-origin="132px 44px">
      <animateTransform attributeName="transform" type="rotate" values="-5 132 44;8 132 44;-5 132 44" dur="2.8s" repeatCount="indefinite"/>
      <path d="M121 41c38-37 95-34 127 2-27 8-50 4-72 17-18 10-36 29-62 19-12-5-12-26 7-38z" fill="#07080d"/>
      <path d="M218 48c15-5 27-2 37 6-20 9-38 11-58 11 6-8 12-13 21-17z" fill="#d4af37" opacity=".85"/>
    </g>

    <ellipse cx="94" cy="72" rx="70" ry="38" fill="#08090f"/>
    <path d="M47 51L30 10l39 24zM105 36l32-28-7 45z" fill="#08090f"/>
    <path d="M47 49L38 24l22 16zM107 37l19-16-4 25z" fill="#d4af37" opacity=".22"/>
    <circle cx="67" cy="63" r="4" fill="#d4af37" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M90 67c12 7 25 7 36 0" stroke="#d4af37" stroke-width="3" stroke-linecap="round" fill="none" opacity=".78"/>
    <path d="M44 97l-16 44h23l15-34zM95 105l-7 36h22l11-39zM138 93l20 47h24l-31-57z" fill="#07080d"/>
    <path d="M21 141h168" stroke="#d4af37" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M33 153c49 9 96 9 143 0" stroke="#8cc7ff" stroke-width="2" stroke-linecap="round" opacity=".24"/>
  </g>

  <path d="M91 183c131 17 247 12 379 3 88-6 153-4 230 5" stroke="#d4af37" stroke-width="2" stroke-linecap="round" opacity=".45"/>
</svg>
