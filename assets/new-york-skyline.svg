<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">New York night skyline</title>
  <desc id="desc">A sleek New York inspired night skyline with a bridge, moonlight, fine window lights, and tiny gold fireflies.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#08182c"/>
      <stop offset="100%" stop-color="#02030a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0%" stop-color="#07101f"/>
      <stop offset="50%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#8f6f21"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fff0a6"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="small-window">
      <rect width="4" height="5" rx=".7" fill="#f8fbff" opacity=".82"/>
    </g>
    <g id="blue-window">
      <rect width="4" height="5" rx=".7" fill="#8cc7ff" opacity=".66"/>
    </g>
    <g id="gold-window">
      <rect width="4" height="5" rx=".7" fill="#d4af37" opacity=".78"/>
    </g>
    <g id="firefly">
      <circle cx="5" cy="5" r="1.7" fill="#fff6b8" opacity=".95" filter="url(#soft-glow)"/>
      <circle cx="5" cy="5" r="4.8" fill="#d4af37" opacity=".16"/>
    </g>
  </defs>

  <rect width="1200" height="260" fill="url(#sky)"/>

