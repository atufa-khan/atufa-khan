<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">New York rooftop cats</title>
  <desc id="desc">A New York inspired night skyline with a bridge, white windows, cool blue lights, and black cats running across the rooftops.</desc>
  <defs>
