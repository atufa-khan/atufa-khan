<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Anime moonlit night sky</title>
  <desc id="desc">An anime inspired moonlit night sky with soft clouds, stars, diagonal power lines, and dark treetop silhouettes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#08112a"/>
      <stop offset="48%" stop-color="#14284b"/>
      <stop offset="100%" stop-color="#070b17"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity=".95"/>
      <stop offset="36%" stop-color="#dce9ff" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#8db7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud-lit" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#c7dcff" stop-opacity=".58"/>
      <stop offset="48%" stop-color="#607ba9" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#243653" stop-opacity=".18"/>
    </radialGradient>
    <filter id="blur-soft" x="-15%" y="-20%" width="130%" height="145%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="star-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="spark" viewBox="0 0 10 10">
      <path d="M5 0l1.1 3.8L10 5 6.1 6.1 5 10 3.9 6.1 0 5l3.9-1.2z" fill="#dbeafe"/>
    </symbol>
    <symbol id="firefly" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="2.2" fill="#fff6b8" opacity=".95" filter="url(#star-glow)"/>
      <circle cx="8" cy="8" r="5.8" fill="#d4af37" opacity=".16"/>
    </symbol>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <g opacity=".55">
    <circle cx="80" cy="40" r="1.2" fill="#dbeafe"/><circle cx="124" cy="83" r=".9" fill="#dbeafe"/>
    <circle cx="203" cy="30" r="1.1" fill="#dbeafe"/><circle cx="290" cy="95" r=".8" fill="#dbeafe"/>
    <circle cx="377" cy="42" r="1" fill="#dbeafe"/><circle cx="466" cy="118" r=".9" fill="#dbeafe"/>
    <circle cx="545" cy="57" r="1.1" fill="#dbeafe"/><circle cx="637" cy="34" r=".9" fill="#dbeafe"/>
    <circle cx="716" cy="102" r="1.2" fill="#dbeafe"/><circle cx="798" cy="47" r=".8" fill="#dbeafe"/>
    <circle cx="872" cy="75" r="1" fill="#dbeafe"/><circle cx="966" cy="37" r="1.2" fill="#dbeafe"/>
    <circle cx="1067" cy="93" r=".9" fill="#dbeafe"/><circle cx="1140" cy="48" r="1" fill="#dbeafe"/>
  </g>
  <g opacity=".82" filter="url(#star-glow)">
    <use href="#spark" x="132" y="143" width="6" height="6"/>
    <use href="#spark" x="309" y="60" width="5" height="5"/>
    <use href="#spark" x="520" y="92" width="5" height="5"/>
    <use href="#spark" x="691" y="63" width="6" height="6"/>
    <use href="#spark" x="934" y="122" width="5" height="5"/>
    <use href="#spark" x="1104" y="151" width="6" height="6"/>
  </g>

  <circle cx="895" cy="105" r="72" fill="url(#moon-glow)" opacity=".9"/>
  <circle cx="895" cy="105" r="25" fill="#f5f0df"/>
  <circle cx="904" cy="96" r="7" fill="#c9d5e8" opacity=".42"/>
  <circle cx="884" cy="113" r="4" fill="#b8c7dd" opacity=".36"/>
  <circle cx="899" cy="117" r="3" fill="#b8c7dd" opacity=".28"/>

  <g opacity=".86" filter="url(#blur-soft)">
    <path d="M91 99c44-37 91-43 125-17 32-35 86-33 116 4 37-11 79 1 98 31-67 25-144 25-231 18-59-5-99-10-108-36z" fill="url(#cloud-lit)"/>
    <path d="M445 155c41-35 89-42 126-18 21-30 70-37 105-7 36-11 83 5 102 34-61 25-132 29-216 19-64-8-105-9-117-28z" fill="url(#cloud-lit)" opacity=".78"/>
    <path d="M780 137c45-39 93-43 134-14 22-34 76-42 113-9 48-8 104 13 125 48-78 25-171 22-282 13-59-5-83-14-90-38z" fill="url(#cloud-lit)" opacity=".88"/>
  </g>
  <g opacity=".22">
    <path d="M60 98c88 36 167 42 257 28" stroke="#dbeafe" stroke-width="2" fill="none"/>
    <path d="M428 152c98 29 209 36 326 13" stroke="#dbeafe" stroke-width="2" fill="none"/>
    <path d="M759 139c117 30 240 37 379 22" stroke="#dbeafe" stroke-width="2" fill="none"/>
  </g>

  <g stroke="#02040b" stroke-width="4" stroke-linecap="round" opacity=".72">
    <path d="M-20 115L1220 278"/>
    <path d="M-20 160L1220 303"/>
    <path d="M-20 215L1220 333"/>
  </g>
  <g stroke="#2b3650" stroke-width="1.5" stroke-linecap="round" opacity=".64">
    <path d="M-20 111L1220 274"/>
    <path d="M-20 156L1220 299"/>
    <path d="M-20 211L1220 329"/>
  </g>

  <g opacity=".95">
    <use href="#firefly" x="240" y="244"/><use href="#firefly" x="315" y="288"/>
    <use href="#firefly" x="621" y="253"/><use href="#firefly" x="712" y="301"/>
    <use href="#firefly" x="1005" y="228"/><use href="#firefly" x="1082" y="276"/>
  </g>

  <g fill="#03060c">
    <path d="M0 360c23-38 59-51 94-28 22-48 79-68 126-31 17-35 55-52 91-32 41 23 54 56 61 91z"/>
    <path d="M902 380c14-46 52-80 97-64 24-50 93-58 130-13 31-18 63-10 71 25v92H902z"/>
    <path d="M0 382c126-30 255-25 405-16 188 11 319-9 478-17 131-7 220 2 317 21v50H0z" opacity=".78"/>
  </g>
  <path d="M0 418h1200" stroke="#d4af37" stroke-width="2" opacity=".72"/>
</svg>
